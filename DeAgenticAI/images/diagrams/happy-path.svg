<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" viewBox="0 0 1600 360" role="img" aria-labelledby="title desc">
  <title id="title">DeAgenticAI Happy Path Execution Sequence</title>
  <desc id="desc">Intent Generation to Chain Broadcast with six policy-controlled steps.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#0B1221"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#7DD3FC" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .box { fill: rgba(11,20,36,0.92); stroke: #38BDF8; stroke-width: 1.2; rx: 16; }
      .box-risk { fill: rgba(15,23,42,0.95); stroke: #7DD3FC; stroke-width: 1.35; rx: 16; }
      .step { fill: #7DD3FC; font-family: 'JetBrains Mono', monospace; font-size: 14px; letter-spacing: 2px; }
      .label { fill: #E2F6FF; font-family: 'Inter', sans-serif; font-size: 19px; font-weight: 500; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="360" fill="url(#bg)" rx="24"/>
  <g opacity="0.28">
    <path d="M 0 80 H 1600" stroke="#ffffff" stroke-opacity="0.1"/>
    <path d="M 0 280 H 1600" stroke="#ffffff" stroke-opacity="0.1"/>
    <path d="M 220 0 V 360" stroke="#ffffff" stroke-opacity="0.06"/>
    <path d="M 480 0 V 360" stroke="#ffffff" stroke-opacity="0.06"/>
    <path d="M 740 0 V 360" stroke="#ffffff" stroke-opacity="0.06"/>
    <path d="M 1000 0 V 360" stroke="#ffffff" stroke-opacity="0.06"/>
    <path d="M 1260 0 V 360" stroke="#ffffff" stroke-opacity="0.06"/>
  </g>

  <g filter="url(#glow)">
    <path d="M 230 180 H 1370" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g transform="translate(70,110)">
    <rect class="box" x="0" y="0" width="210" height="140"/>
    <text class="step" x="20" y="34">STEP 01</text>
    <text class="label" x="20" y="82">Intent</text>
    <text class="label" x="20" y="108">Generation</text>
  </g>

  <g transform="translate(330,110)">
    <rect class="box" x="0" y="0" width="210" height="140"/>
    <text class="step" x="20" y="34">STEP 02</text>
    <text class="label" x="20" y="82">Intent</text>
    <text class="label" x="20" y="108">Sanitization</text>
  </g>

  <g transform="translate(590,110)">
    <rect class="box" x="0" y="0" width="210" height="140"/>
    <text class="step" x="20" y="34">STEP 03</text>
    <text class="label" x="20" y="82">Policy</text>
    <text class="label" x="20" y="108">Evaluation</text>
  </g>

  <g transform="translate(850,110)">
    <rect class="box-risk" x="0" y="0" width="210" height="140"/>
    <text class="step" x="20" y="34">STEP 04</text>
    <text class="label" x="20" y="82">Fraud</text>
    <text class="label" x="20" y="108">Detection</text>
  </g>

  <g transform="translate(1110,110)">
    <rect class="box-risk" x="0" y="0" width="210" height="140"/>
    <text class="step" x="20" y="34">STEP 05</text>
    <text class="label" x="20" y="82">MPC</text>
    <text class="label" x="20" y="108">Threshold Signing</text>
  </g>

  <g transform="translate(1370,110)">
    <rect class="box" x="0" y="0" width="210" height="140"/>
    <text class="step" x="20" y="34">STEP 06</text>
    <text class="label" x="20" y="82">Chain</text>
    <text class="label" x="20" y="108">Broadcast</text>
  </g>
</svg>
